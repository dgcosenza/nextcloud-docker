# Hardened Docker Compose example for dgcosenza/nextcloud
# Pin by @sha256 digest in production.
# Available identically on Docker Hub (dgcosenza/nextcloud) and GHCR (ghcr.io/dgcosenza/nextcloud).

services:
  nextcloud:
    image: dgcosenza/nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:nosuid,size=256m
      - /run:nosuid,size=32m
    ports:
      - "192.0.2.10:8084:443"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - NEXTCLOUD_CRON_INTERVAL=300
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1:443/status.php >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
